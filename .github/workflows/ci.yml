name: CI

on:
  # On main, only re-run when code actually changed (docs-only pushes skip it).
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'web/src/**'
      - 'web/index.html'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/vite.config.js'
      - 'web/svelte.config.js'
      - '.github/workflows/ci.yml'
  # On PRs, always run so it's a reliable required status check for branch
  # protection (a path-filtered required check would hang docs-only PRs).
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate translation catalogs
        run: node web/scripts/check-i18n.mjs

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      # web/dist is committed (go:embed needs it for `go install`). Fail if a PR
      # changed the frontend but didn't rebuild + commit the embedded output.
      - name: Verify embedded web/dist is current
        run: |
          git diff --exit-code -- web/dist || {
            echo "::error::web/dist is stale, run 'make build' and commit web/dist."
            exit 1
          }

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (race)
        run: go test -race ./...
